{% extends 'base.html' %}{% block title %}Log in — Savorly{% endblock %}
{% block content %}<section class="narrow"><p class="eyebrow">Welcome back</p><h1>Log in</h1>
<form method="post" class="panel stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username or email<input name="identity" value="{{ request.form.identity or '' }}" required autocomplete="username"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="button" type="submit">Log in</button>
</form><p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p></section>{% endblock %}
